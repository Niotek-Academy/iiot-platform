version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/db/migrations/000001_init_schema.up.sql"
      - "internal/db/migrations/000002_add_sensor_source_address.up.sql"
      - "internal/db/migrations/000003_add_machine_control_address.up.sql"
    gen:
      go:
        package: "generated"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false